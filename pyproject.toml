[project]
name = "medical-rag-hosted"
version = "0.1.0"
description = "Hosted profile of the Medical RAG system: hybrid retrieval, RRF, a two-stage confidence gate, and cited answers."
readme = "README.md"
requires-python = ">=3.12"

# rag_core imports nothing outside the standard library. That is the point of
# the package, and it is enforced by tests/unit/test_core_purity.py. Provider
# SDKs and database drivers arrive with the adapters in TICKET-2 and TICKET-3,
# as optional dependencies — never here.
dependencies = []

# Adapters bring their own drivers. Keeping the base empty is a stronger claim
# than a comment: `pip install medical-rag-hosted` gets you rag_core and
# nothing else, and tests/unit/test_core_purity.py asserts it stays that way.
[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
    "pgvector>=0.3",
]
providers = [
    "google-genai>=1.0",
    "groq>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "asyncpg-stubs>=0.30",
    "medical-rag-hosted[postgres,providers]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core", "src/rag_adapters", "src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# `auto` lets async tests run without decorating each one. Leaving
# asyncio_default_fixture_loop_scope unset emits a DeprecationWarning on every
# run, which trains you to ignore warnings.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Mirrors the local build's `markers = ollama` / `addopts = -m "not ollama"`.
# `uv run pytest` must stay green on a machine with no database at all; CI runs
# `uv run pytest -m postgres` as a second step against a service container.
# A command-line -m REPLACES this one rather than merging with it.
markers = [
    "postgres: requires a live Postgres with pgvector (deselected by default)",
    "live: calls a real provider API and costs quota (deselected by default, never in CI)",
]
addopts = '-m "not postgres and not live"'

[tool.ruff]
# Prose is not ours to reformat. ruff formats Python code blocks inside
# Markdown, which quietly rewrote the port definitions in ARCHITECTURE.md — a
# doc whose code blocks are quoted specification, not source.
extend-exclude = ["docs"]

# NOT the ruff default of 88. The modules ported from the local build were
# written at ~95 columns, and their wide explanatory comments carry measured
# behaviour. Reformatting to 88 produces a large meaningless diff against the
# source repo and makes real divergence impossible to spot — see the port
# faithfulness checks in the plan's validation commands.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The vendored port. These files are copied from the local build so the two
# profiles can be diffed against each other — that diff is the only mechanism
# proving the pipelines have not drifted, and a formatter rewrite destroys it.
#
# The rules suppressed below are all style preferences that would force an edit
# to code we deliberately do not own:
#   B905  zip() without strict=      (chunking.py, predates the parameter)
#   B017  pytest.raises(Exception)   (test_gate.py asserts frozen-ness)
#   E501  line too long              (written at the source repo's width)
#   I001  import block unsorted      (source ordering, kept as-is)
[tool.ruff.lint.per-file-ignores]
"src/rag_core/chunking.py" = ["B905"]
"src/rag_core/fusion.py" = ["B905", "E501"]
"src/rag_core/gate.py" = ["B905", "E501"]
"tests/unit/test_chunking.py" = ["E501", "I001"]
"tests/unit/test_fusion.py" = ["E501", "I001"]
"tests/unit/test_gate.py" = ["B017", "E501", "I001"]
# axes.py is ported from the local build; its comments carry two recorded bugs.
"src/ingest/axes.py" = ["E501"]

[tool.ruff.format]
# Same reasoning as the per-file-ignores above: reformatting the vendored port
# would produce a large, meaningless diff against the source repo and make real
# divergence impossible to spot. Everything else in the tree IS formatted.
exclude = [
    "src/rag_core/chunking.py",
    "src/rag_core/fusion.py",
    "src/rag_core/gate.py",
    "src/rag_core/prompts.py",
    "src/rag_core/sentinel.py",
    "tests/unit/test_chunking.py",
    "tests/unit/test_fusion.py",
    "tests/unit/test_gate.py",
    "tests/unit/test_prompts.py",
    "tests/unit/test_sentinel.py",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

# gate.py and prompts.py are ported verbatim from the local build, and staying
# diffable against it is what makes behavioural divergence between the two
# profiles visible. Their bare `dict` annotations would need widening to
# `dict[str, Any]` to satisfy --strict, which is a null change at runtime but a
# real change to the diff.
#
# So exactly one axis of strictness is relaxed, for exactly those two modules.
# Every other strict check still applies to them. Delete these overrides when a
# ticket has a reason to modify either module anyway.
[[tool.mypy.overrides]]
module = ["rag_core.gate", "rag_core.prompts"]
disallow_any_generics = false
