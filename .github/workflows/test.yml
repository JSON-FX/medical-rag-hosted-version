name: test

on:
  # Every branch, not just main: a feature branch that has not opened a PR yet
  # should still be checked, and waiting for the PR to find out is a slow way
  # to learn the tree is broken.
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Postgres with pgvector, for the store contract tests. Free, fast, and
      # no credentials — the alternative was a Neon branch per run, which
      # couples the suite to an account and adds network flakiness to a check
      # that runs on every push.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # Two steps, deliberately. The first proves the default suite stays green
      # on a machine with no database at all — which is what keeps rag_core
      # testable in milliseconds with nothing installed.
      - name: Tests (no database)
        run: uv run pytest -v

      - name: Migrate
        run: uv run python db/migrate.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # A command-line -m REPLACES the one in addopts rather than merging.
      - name: Tests (Postgres)
        run: uv run pytest -m postgres -v
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # A separate job rather than more steps on `check`: the frontend needs Node
  # and no database, the backend needs Python and a database, and neither
  # waits on the other. A single job would serialise them and make a Node
  # install a prerequisite for learning that mypy is unhappy.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails
      # if package.json has drifted from it, which is the point of committing
      # a lockfile at all.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
