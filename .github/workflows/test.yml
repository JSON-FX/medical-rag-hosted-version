name: test

on:
  # Every branch, not just main: a feature branch that has not opened a PR yet
  # should still be checked, and waiting for the PR to find out is a slow way
  # to learn the tree is broken.
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v
